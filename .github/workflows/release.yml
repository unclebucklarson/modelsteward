name: release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds the Linux binary, packages a tarball with the licenses and README,
# publishes both plus a sha256 checksum on the GitHub release page.

on:
  push:
    tags: ["v*"]
  # Manual re-run for a tag whose original run predates a workflow change
  # (e.g. running the crates.io publish for v0.1.0 after adding the secret).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package tarball
        run: |
          NAME=modelsteward-${GITHUB_REF_NAME}-x86_64-linux-gnu
          mkdir -p dist/$NAME
          cp target/release/modelsteward README.md LICENSE-MIT LICENSE-APACHE dist/$NAME/
          tar -C dist -czf dist/$NAME.tar.gz $NAME
          (cd dist && sha256sum $NAME.tar.gz > $NAME.tar.gz.sha256)
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true

  publish-crate:
    # Publishes to crates.io AFTER the build+test job succeeds. Requires
    # the CARGO_REGISTRY_TOKEN repository secret (Settings → Secrets →
    # Actions; a crates.io token scoped to publish). Versions there are
    # immutable — hence tests first, and the already-published guard makes
    # re-runs harmless.
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this version is already on crates.io
        id: check
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if curl -sf "https://crates.io/api/v1/crates/modelsteward/$VERSION" > /dev/null; then
            echo "published=yes" >> "$GITHUB_OUTPUT"
            echo "modelsteward $VERSION already on crates.io — skipping"
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Install system dependencies
        if: steps.check.outputs.published == 'no'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.published == 'no'
      - name: Publish to crates.io
        if: steps.check.outputs.published == 'no'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
