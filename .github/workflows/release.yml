name: release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds the Linux binary, packages a tarball with the licenses and README,
# publishes both plus a sha256 checksum on the GitHub release page.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package tarball
        run: |
          NAME=modelsteward-${GITHUB_REF_NAME}-x86_64-linux-gnu
          mkdir -p dist/$NAME
          cp target/release/modelsteward README.md LICENSE-MIT LICENSE-APACHE dist/$NAME/
          tar -C dist -czf dist/$NAME.tar.gz $NAME
          (cd dist && sha256sum $NAME.tar.gz > $NAME.tar.gz.sha256)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
