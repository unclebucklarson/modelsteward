[package]
name = "modelsteward"
version = "0.6.5"
edition = "2024"
description = "Measured, not guessed: a llama.cpp server manager that tunes local models to their best performance and keeps OpenCode (and any OpenAI-compatible app) configured from real measurements."
license = "MIT OR Apache-2.0"
authors = ["Scott Larson"]
repository = "https://github.com/unclebucklarson/modelsteward"
readme = "README.md"
keywords = ["llama-cpp", "llm", "local-ai", "benchmark", "opencode"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
eframe = "0.36.1"
env_logger = "0.11.11"
jsonc-parser = { version = "0.26", features = ["serde"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
