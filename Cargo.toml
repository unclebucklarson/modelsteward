[package]
name = "llamacppcodeconf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = "0.36.1"
env_logger = "0.11.11"
jsonc-parser = { version = "0.26", features = ["serde"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
